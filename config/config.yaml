# -----------------------------------------------------------------------------
# FaunaScope-Edge: Main Configuration File
# -----------------------------------------------------------------------------
# This file contains all the tunable parameters for the application.
# Edit these values to match your specific hardware and server setup.
# -----------------------------------------------------------------------------

# =============================================================================
# Module A: Motion Detector Configuration
# =============================================================================
motion_detector:

  # The video source to use for motion detection.
  # Can be a camera index (e.g., 0 for the first camera) or a path to a video file.
  # Loaded from .env file to support different deployments
  video_source: ${VIDEO_SOURCE}

  # Camera hardware acceleration settings
  # These settings are used when video_source is a camera device (integer)
  # Values should match your camera's supported resolutions and framerates
  # Run 'v4l2-ctl -d /dev/videoX --list-formats-ext' to see supported values
  # Loaded from .env file to support different hardware configurations
  camera_width: ${CAMERA_WIDTH}
  camera_height: ${CAMERA_HEIGHT}
  camera_fps: ${CAMERA_FPS}

  blur_kernel_size: [21, 21]
  # The width (in pixels) to which frames are resized for motion analysis.
  # Smaller values are faster but less sensitive to small movements.
  motion_frame_width: 640

  # The minimum pixel area of a moving object to be considered significant.
  # This helps filter out noise like insects, leaves, or sensor noise.
  min_motion_contour_area: 500

  # The duration in seconds to continue recording after motion has stopped.
  # This ensures the full event is captured if an animal pauses briefly.
  motion_cooldown_seconds: 20.0

# =============================================================================
# Module B: Animal Analyzer Configuration
# =============================================================================
animal_analyzer:

  device_id: "${DEVICE_ID}"

  location:
    latitude: ${DEVICE_LATITUDE}    # Loaded from .env file
    longitude: ${DEVICE_LONGITUDE}  # Loaded from .env file
    timezone: "${DEVICE_TIMEZONE}"  # e.g., "America/Chicago", "America/New_York"

  output_fps: 30.0  # The FPS for output video files. Adjust based on your needs.

  # MegaDetector V6 (MDV6-mit-yolov9-c) in ONNX form; scripts/export_megadetector.py makes it from the published checkpoint.
  detector_model_path: "model_weight/MDV6-mit-yolov9-c.onnx"

  # On a GPU with TensorRT, the first start converts the model into a TensorRT engine (about 8 minutes on a Jetson Orin Nano) and keeps it here; later starts take seconds.
  detector_engine_cache_dir: "data/detector_cache/"

  # MegaDetector's classes are animal, person, and vehicle. An event is kept when a track of one of these classes is confirmed.
  trigger_classes: ['animal', 'person']

  # The minimum MegaDetector confidence (0.0 to 1.0) for a detection to count.
  confidence_threshold: 0.2

  # MegaDetector runs on every N-th frame of an event, starting with the first; optical-flow tracking moves its boxes through the frames in between.
  detection_interval_frames: 5

  # A track is confirmed once it has been detected in this many detection frames.
  confirmation_detections: 2

  # A detection continues the track of the same class whose box it overlaps most, if their IoU is at least track_match_iou. A track that no detection continues in more than track_max_missed_detections detection frames in a row ends.
  track_match_iou: 0.3
  track_max_missed_detections: 2

  # The maximum number of full-resolution frames to hold in RAM at one time.
  # If an event is longer than this, frames will be temporarily written to disk
  # to prevent running out of memory.
  ram_frame_limit: 700

  # The local directory where final video/JSON packages are placed before upload.
  output_pending_dir: "data/pending_upload/"

  # --- Debugging Options ---
  # Set to true to save all motion events (even insignificant ones) for manual inspection.
  # Set to false for normal operation (deletes insignificant events to save space).
  debug_mode: true

  # The directory for storing temporary video parts for manual inspection.
  debug_temp_dir: "data/temp_debug/"

  # A directory for storing temporary video parts DURING detection.
  # Using /tmp (RAM disk) minimizes disk I/O and wear on the SD card/NVMe.
  output_temp_dir: "/tmp/FaunaScope_edge_temp/"

# =============================================================================
# Module C: Data Uploader Configuration
# =============================================================================
uploader:
  # Enable or disable the data uploader.
  # When set to false, captured videos and JSON files will remain in the pending_upload folder.
  # When set to true, the uploader will attempt to upload files to the remote server.
  # Loaded from .env file to allow per-deployment control
  enabled: ${UPLOADER_ENABLED}

  # The interval in seconds for the uploader to scan the pending directory for new files.
  scan_interval_seconds: 60

  # The FaunaScope server, e.g. https://faunascope.txst.edu, and this device's upload token, issued by the server's administrator. Both are loaded from the .env file.
  server_url: "${SERVER_URL}"
  device_token: "${DEVICE_TOKEN}"

  # Videos are sent in chunks of this size. An interrupted upload resumes at the last chunk the server confirmed, so smaller chunks waste less on a poor link.
  chunk_size_kb: 1024

  # The most video data to send per calendar day, so that a backlog cannot use up the cellular data plan. 800 MB a day suits a 30 GB monthly plan.
  daily_upload_limit_mb: 800

  # Network failures pause all uploads for 1, 2, 4, ... minutes, up to an hour, and do not count against any event. An event the server rejects is retried event_attempts times, then deferred for deferral_hours; after max_deferrals deferrals it gets a .failed marker (delete the marker to retry it).
  event_attempts: 3
  deferral_hours: 24
  max_deferrals: 3
  request_timeout_seconds: 60

# =============================================================================
# Live View Configuration (Optional)
# =============================================================================
live_view:
  # Set to true to enable the live view functionality. The MotionDetector will
  # check for the lock file and write frames if it exists.
  enabled: true
  
  # The path on the RAM disk where the latest frame will be written as a JPEG.
  # /dev/shm is a standard RAM disk on most Linux systems.
  ram_disk_path: "/dev/shm/live_frame.jpg"
  
  # The path to the lock file that signals an active viewer.
  # The stream_server.py will create and delete this file.
  lock_file_path: "/dev/shm/viewer_active.lock"

  # JPEG quality for live view frames (0-100). Lower = smaller size.
  jpeg_quality: 60

  # Target frames-per-second for the stream server.
  target_fps: 15

  # Minimum FPS when network resilience backoff reduces rate.
  min_fps: 5

  # Maximum simultaneous viewers allowed. Excess viewers receive 503.
  max_viewers: 3

  # If the stream server dies and leaves the lock file behind, the detector will
  # stop writing frames when the lock file mtime is older than this threshold.
  lock_stale_timeout_seconds: 2.0

  # How often the stream server should refresh the lock file mtime (seconds).
  lock_heartbeat_seconds: 0.5

  # Maximum duration in seconds a user can watch the live stream before it pauses
  # to save data budget. Set to 0 for no limit (not recommended for LTE).
  stream_timeout_seconds: 60
